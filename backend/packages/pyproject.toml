[tool.poetry]
name = "Backend packages"
version = "0.1.0"
description = "Hackaton backend packages"
authors = ["zxcenigma66@yandex.ru"]
license = "Copyright (c) 2026 zxcenigma"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.135.3,<0.136.0"
uvicorn = "^0.49.0"
pydantic = {extras = ["email"], version = "^2.12.5"}
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.49,<3.0.0"}
pydantic-settings = ">=2.13.1,<3.0.0"
alembic = ">=1.18.4,<2.0.0"
asyncpg = ">=0.31.0,<0.32.0"
httpx = "^0.28.1"
pyjwt = "^2.11.0"
cryptography = "^46.0.5"
fastapi-pagination = "0.15.15"
redis = "^7.4.0"
celery = "^5.6.3"
itsdangerous = "^2.2.0"
jinja2 = "^3.1.6"
aiofiles = "^25.1.0"
python-multipart = "^0.0.32"
passlib = ">=1.7.4,<2.0.0"
bcrypt = "4.3.0"
openpyxl = "^3.1.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
faker = "^40.8.0"

[tool.pytest.ini_options]
python_paths = "."
testpaths = "tests"