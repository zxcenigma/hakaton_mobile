# Full stack for «Монетка».
#
# ТЗ §3.2 — «локальный запуск выполняться по одной понятной процедуре,
# предпочтительно с использованием Docker Compose». That procedure is:
#
#     cp .env.template .env && make up
#
# Nothing here is required to run the pipeline: `monetka demo` does the whole
# thing on DuckDB with no containers at all. This stack exists to run it the way
# it would run in production — streaming ingest, object storage, a real catalog,
# a query engine and an orchestrator — so the SQL and the DAGs are exercised
# against the engines they would actually meet.
#
# Profiles keep the footprint honest. The numbers below are measured working
# sets, not wishes — `monetka stack-check` recomputes them from this file:
#
#   default  — lakehouse + API                    ≈4.0 GB RAM, 7 services
#   full     — adds Airflow, MLflow, Grafana      ≈6.6 GB RAM, 11 services
#
#     docker compose up -d                       # default
#     docker compose --profile full up -d        # everything
#
# **Minimum 8 GB RAM for the default profile, 12 GB for `full`.** Docker on
# Windows and macOS also needs hardware virtualisation enabled in BIOS/UEFI;
# without it no Docker variant starts at all.
#
# None of this is needed to run the pipeline: `monetka demo` does the whole
# thing on DuckDB with no containers.

name: monetka

x-common-env: &common-env
  MONETKA_RUN_MODE: compose
  MONETKA_LOG_LEVEL: ${MONETKA_LOG_LEVEL:-INFO}
  MONETKA_S3_ENDPOINT: http://seaweedfs:9000
  MONETKA_S3_ACCESS_KEY: ${MONETKA_S3_ACCESS_KEY:-monetkalocal}
  MONETKA_S3_SECRET_KEY: ${MONETKA_S3_SECRET_KEY:-monetkalocal}
  MONETKA_KAFKA_BOOTSTRAP: redpanda:9092
  MONETKA_SCHEMA_REGISTRY_URL: http://redpanda:8081
  MONETKA_ICEBERG_CATALOG_URI: http://iceberg-rest:8181
  MONETKA_TRINO_HOST: trino
  MONETKA_MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  # ------------------------------------------------------------ streaming --
  # Redpanda rather than Kafka + ZooKeeper: same protocol, one process, and it
  # fits in the RAM budget of the laptop a reviewer will actually run this on.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,EXTERNAL://localhost:19092
      - --schema-registry-addr 0.0.0.0:8081
    ports:
      - "19092:19092"   # Kafka API from the host
      - "18081:8081"    # Schema Registry
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: /bin/sh
    command:
      - -c
      - |
        rpk topic create monetka.game.events.v1 -p 3 -r 1 --brokers redpanda:9092 || true
        rpk topic create monetka.game.events.dlq.v1 -p 1 -r 1 --brokers redpanda:9092 || true
        echo "topics ready"
    restart: "no"

  # -------------------------------------------------------- object storage --
  # SeaweedFS rather than MinIO.
  #
  # MinIO withdrew its community container images from public registries: every
  # tag of `minio/minio`, including `latest` and releases from 2022, now answers
  # `denied: requested access to the resource is denied` without credentials.
  # A stack nobody can pull is not a stack, so the object store is SeaweedFS —
  # Apache-2.0, a real S3 gateway, and lighter than MinIO was.
  seaweedfs:
    image: chrislusf/seaweedfs:3.68
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=256
      - -volume.max=8
    ports:
      - "9000:9000"   # S3 API
      - "9333:9333"   # master status
    healthcheck:
      # 127.0.0.1, not localhost: the image resolves `localhost` to ::1 as well,
      # BusyBox wget tries IPv6 first, and SeaweedFS listens on IPv4 only — so
      # the probe got "connection refused" from a service that was fully up.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    volumes:
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweed-data:/data

  # SeaweedFS does not create buckets implicitly, and the Iceberg catalog
  # expects its warehouse bucket to exist before it writes anything.
  storage-init:
    image: amazon/aws-cli:2.17.0
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${MONETKA_S3_ACCESS_KEY:-monetkalocal}
      AWS_SECRET_ACCESS_KEY: ${MONETKA_S3_SECRET_KEY:-monetkalocal}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for b in monetka-bronze monetka-silver monetka-gold monetka-mlflow; do
          if aws --endpoint-url http://seaweedfs:9000 s3api create-bucket --bucket $$b >/dev/null 2>&1; then
            echo "created $$b"
          else
            echo "$$b already present"
          fi
        done
        aws --endpoint-url http://seaweedfs:9000 s3 ls
        echo "buckets ready"
    restart: "no"

  # ------------------------------------------------------------- lakehouse --
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      storage-init: { condition: service_completed_successfully }
    environment:
      CATALOG_WAREHOUSE: s3://monetka-bronze/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MONETKA_S3_ACCESS_KEY:-monetkalocal}
      AWS_SECRET_ACCESS_KEY: ${MONETKA_S3_SECRET_KEY:-monetkalocal}
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"

  trino:
    image: trinodb/trino:458
    depends_on:
      iceberg-rest: { condition: service_started }
    # The catalog file reads these. Without them Trino resolves ${ENV:...} to
    # nothing and exits during loadInitialCatalogs — which looked like a health
    # check problem until the container logs were read.
    environment:
      MONETKA_S3_ACCESS_KEY: ${MONETKA_S3_ACCESS_KEY:-monetkalocal}
      MONETKA_S3_SECRET_KEY: ${MONETKA_S3_SECRET_KEY:-monetkalocal}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
      # Trino's stock JVM config takes ~2 GB before doing any work. Capped to
      # 1 GB so the default profile fits on an 8 GB laptop.
      - ./infra/trino/jvm.config:/etc/trino/jvm.config:ro
    healthcheck:
      # Same IPv6 trap as SeaweedFS: the CLI defaults to localhost, which
      # resolves to ::1 here, and Trino listens on IPv4.
      test: ["CMD", "trino", "--server", "http://127.0.0.1:8080", "--execute", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # -------------------------------------------------------------- metadata --
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monetka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monetka}
      POSTGRES_DB: monetka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monetka}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ------------------------------------------------------------ platform ----
  # `./data` and `./artifacts` are bind-mounted into containers that run as uid
  # 999. The Dockerfile chowns those paths, but a bind mount hides whatever the
  # image put there and brings the host's ownership instead — root, under WSL
  # and on any Linux host. The API then died on startup with
  # `PermissionError: /app/artifacts/registry`.
  #
  # Fixing it here rather than in the Makefile keeps `docker compose up` the one
  # procedure ТЗ §3.2 asks for: no host-side chown to remember, and it works the
  # same on Linux, WSL and Docker Desktop.
  workspace-init:
    image: busybox:1.36
    user: root
    command:
      - sh
      - -c
      - |
        mkdir -p /work/data /work/artifacts
        chown -R 999:999 /work/data /work/artifacts
        echo "workspace ready"
    volumes:
      - ./artifacts:/work/artifacts
      - ./data:/work/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runtime
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      workspace-init: { condition: service_completed_successfully }
    environment:
      <<: *common-env
    command: ["monetka", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data

  ingestor:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runtime
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      workspace-init: { condition: service_completed_successfully }
    environment:
      <<: *common-env
    command: ["python", "-m", "monetka.ingestion.stream_consumer"]
    # The image's HEALTHCHECK probes the API on port 8000. This service is a
    # Kafka consumer and listens on nothing, so it inherited a check it could
    # never pass and sat at `unhealthy` forever while working correctly — the
    # kind of permanent red that teaches people to ignore the column.
    #
    # Disabled rather than replaced: liveness for a consumer means «is it still
    # committing offsets», which needs the broker, not a shell probe. Nothing
    # waits on this service's health.
    healthcheck:
      disable: true
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  # ---------------------------------------------------------------- mlops --
  mlflow:
    profiles: ["full"]
    image: ghcr.io/mlflow/mlflow:v2.16.2
    depends_on:
      postgres: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:9000
      AWS_ACCESS_KEY_ID: ${MONETKA_S3_ACCESS_KEY:-monetkalocal}
      AWS_SECRET_ACCESS_KEY: ${MONETKA_S3_SECRET_KEY:-monetkalocal}
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary boto3 &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri postgresql://${POSTGRES_USER:-monetka}:${POSTGRES_PASSWORD:-monetka}@postgres/monetka
             --default-artifact-root s3://monetka-mlflow/"
    ports:
      - "5000:5000"

  # -------------------------------------------------------- orchestration --
  airflow:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.airflow
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-monetka}:${POSTGRES_PASSWORD:-monetka}@postgres/monetka
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    command: standalone
    ports:
      - "8081:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  # ------------------------------------------------------- observability ---
  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["full"]
    image: grafana/grafana:11.2.0
    depends_on:
      prometheus: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  redpanda-data:
  seaweed-data:
  postgres-data:
  grafana-data:
