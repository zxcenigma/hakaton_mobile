global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: monetka

scrape_configs:
  - job_name: monetka-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: serving

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Alerting rules live here rather than in Grafana so they are version-controlled
# and reviewed like code.
rule_files:
  - /etc/prometheus/rules/*.yml
