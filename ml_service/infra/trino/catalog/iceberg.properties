# Iceberg on SeaweedFS through the REST catalog.
#
# Credentials are not in this file: they arrive as environment variables, which
# docker-compose populates from `.env` (ТЗ §3.4 — no secrets in the repository).
# The compose service must actually declare them — it did not, and Trino died on
# startup with an unresolved ${ENV:...} until the first real run caught it.

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://monetka-bronze/warehouse

fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MONETKA_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:MONETKA_S3_SECRET_KEY}

# Small files are the norm here: an offline-first app delivers events in bursts.
# Compaction keeps the metadata layer from drowning in them.
iceberg.target-max-file-size=128MB
iceberg.unique-table-location=true
