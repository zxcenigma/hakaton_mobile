# Отдельный пакет ради одного: чтобы `monetka_advisor.dart` можно было
# проверить анализатором.
#
# До этого файла проверить его было нечем. Лежал исходник без пакета —
# `flutter analyze` такой каталог просто пропускает, и любая опечатка в
# контракте доезжала бы до приложения незамеченной. Для файла, который
# описывает границу между платформой и приложением, это ровно та ошибка,
# которую дороже всего ловить поздно.
#
# Пакет намеренно пустой: ни ассетов, ни точки входа. Сборкой занимается
# приложение, здесь только проверка.
#
#   flutter pub get
#   flutter analyze
name: monetka_advisor
description: >
  Контракт Советника «Монетки»: загрузка ONNX-модели на устройстве и правила,
  которые принимают решение. Приложение реализует этот интерфейс, платформа
  экспортирует под него модель.
version: 0.1.0
publish_to: none

environment:
  # 3.0 — минимум из-за `abstract final class` и switch-выражений в коде.
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Версия зафиксирована той же, что указана в шапке monetka_advisor.dart.
  # Если разойдутся, приложение и платформа начнут собираться по-разному.
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_lints: ^5.0.0
