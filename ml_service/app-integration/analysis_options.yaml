include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Ошибки типов — ошибки, а не предупреждения. Файл описывает контракт,
    # по которому приложение собирает вектор признаков; молчаливое приведение
    # типа здесь означает модель, которая уверенно отвечает на мусор.
    strict-casts: true
    strict-raw-types: true
  # Добавляет сам flutter при первом `pub get`, если строки нет. Записано
  # явно, чтобы инструмент не правил файл под собой при каждом запуске.
  exclude:
    - build/**
  errors:
    # Неиспользованный импорт или переменная — почти всегда след недоделанной
    # правки. Пусть падает, а не копится.
    unused_import: error
    unused_local_variable: error
    # Публичный API без комментария здесь недопустим: этим файлом пользуется
    # другая команда, и единственное, что у неё есть, — текст рядом с кодом.
    public_member_api_docs: ignore

linter:
  rules:
    # Советник обязан отвечать всегда. `await` без обработки ошибки — это
    # путь, на котором игровой цикл падает из-за необязательной подсказки.
    - unawaited_futures
    - avoid_print
    - prefer_final_locals
