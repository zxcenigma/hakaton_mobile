# Финансовые цели накопления.
#
# ТЗ §2.5.7 — у цели понятная стоимость, видно накопленное и остаток; ТЗ §2.6 —
# минимум 3 цели, здесь 5.
#
# Срок достижения (eta) считается ДЕТЕРМИНИРОВАННОЙ формулой, а не моделью:
#
#     eta_periods = ceil((cost - saved) / avg_deposit_per_period)
#
# ТЗ §2.5.7 прямо требует, чтобы расчёт был «понятным и основанным на средней
# сумме регулярного пополнения». Поэтому ML к этому числу не подпускается —
# модель прогноза достижения цели используется только офлайн, для балансировки
# контента методистом (см. docs/ml-cards/goal_reachability.md).

schema_version: 1

goals:
  - id: goal_ball_big
    cost: 90
    child_label: "Большой мяч"
    hint: "Близкая цель. Хорошо подходит для первого раза."
    tier: short

  - id: goal_book_set
    cost: 150
    child_label: "Набор книжек"
    hint: "Если откладывать по 25 монет, накопишь за 6 периодов."
    tier: short

  - id: goal_backpack
    cost: 220
    child_label: "Рюкзак"
    hint: "Средняя цель. Понадобится терпение примерно на 8 периодов."
    tier: medium

  - id: goal_scooter
    cost: 300
    child_label: "Самокат"
    hint: "Большая цель. По 30 монет в период — это 10 периодов."
    tier: long

  - id: goal_tent
    cost: 420
    child_label: "Палатка для похода"
    hint: "Самая дальняя цель. Копить долго, зато результат заметный."
    tier: long
