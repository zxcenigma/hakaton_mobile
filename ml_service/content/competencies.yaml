# Карта образовательного контента (ТЗ §5.7).
#
# Связывает механику приложения с Единой рамкой компетенций в области финансовой
# грамотности и финансовой культуры (раздел 6, базовый уровень, НОО),
# утверждённой протоколом шестого заседания Межведомственной координационной
# комиссии от 5 марта 2026 года.
#
# Формулировки компетенций приведены по ТЗ §1. Для каждой указано: каким
# заданием формируется, какой метрикой витрины измеряется и что видит взрослый
# в защищённом разделе.

schema_version: 1
framework: "Единая рамка компетенций в области финансовой грамотности и финансовой культуры, раздел 6"
level: "базовый, начальное общее образование"

competencies:
  - id: fin_1
    statement: >-
      Понимать назначение личного и семейного бюджетов и то, что расходы не
      должны превышать доходов.
    quests: [budget_first_plan, budget_leftover, budget_unexpected]
    mechanic: "Планирование бюджета до периода; приложение не даёт распределить больше доступного."
    measured_by: "gold.mart_period_summary.plan_adherence, доля периодов без отказов по нехватке средств"
    adult_view: "Сколько периодов план уложился в доступную сумму."

  - id: fin_2
    statement: "Различать обязательные и необязательные расходы: необходимое и желаемое."
    quests: [payments_compare_price, payments_not_enough, payments_need_vs_want]
    mechanic: "Каталог покупок разделён на две категории; перед покупкой видно категорию и влияние."
    measured_by: "gold.mart_period_summary.essential_coverage, доля трат на optional"
    adult_view: "Доля обязательных покупок, закрытых вовремя."

  - id: fin_3
    statement: "Планировать простые покупки и принимать решения в условиях ограниченного бюджета."
    quests: [budget_first_plan, budget_unexpected, payments_compare_price, payments_need_vs_want]
    mechanic: "Ограниченная сумма на период: купить всё сразу невозможно."
    measured_by: "gold.mart_period_summary.rejected_purchases, unallocated_coins"
    adult_view: "Как ребёнок поступает, когда монет не хватает."

  - id: fin_4
    statement: "Ставить краткосрочную финансовую цель и регулярно откладывать часть средств."
    quests: [saving_first_goal, saving_regular, saving_withdraw]
    mechanic: "Выбор цели, регулярные пополнения, понятный срок по средней сумме пополнения."
    measured_by: "gold.mart_goal_progress.deposit_regularity, periods_to_goal"
    adult_view: "Регулярность пополнений и прогресс по текущей цели."

  - id: fin_5
    statement: "Оценивать собственные финансовые решения и объяснять, к чему они привели."
    quests: [budget_leftover, budget_unexpected, saving_regular, saving_withdraw, payments_need_vs_want]
    mechanic: "Сравнение плана с фактом и объяснение изменения состояния питомца после каждого решения."
    measured_by: "gold.mart_quest_effectiveness.improvement_after_explanation"
    adult_view: "Пройденные темы и динамика по каждой."

  - id: fin_6
    statement: >-
      Использовать детское мобильное приложение для планирования бюджета и
      накоплений при участии значимого взрослого.
    quests: []
    mechanic: "Раздел для взрослого за простым барьером; начисление бонусов взрослым; сброс профиля."
    measured_by: "доля профилей с хотя бы одним adult_bonus и открытием раздела взрослого"
    adult_view: "Сам раздел и есть реализация этой компетенции."
