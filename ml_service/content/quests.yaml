# Финансовые задания «Монетки».
#
# ТЗ §2.5.8 — минимум 3 темы (планирование бюджета, сбережения, платежи и
# покупки); ТЗ §2.6 — минимум 6 заданий. Здесь 9, по 3 на тему.
#
# Задание — игровая ситуация с выбором и последствием, а не викторина: каждый
# вариант меняет баланс, накопления или состояние питомца. После ЛЮБОГО выбора
# показывается объяснение — и когда решение удачное, и когда нет (ТЗ §2.5.8).
#
# Тон (ТЗ §3.5): объяснение не стыдит и не пугает. Формулировка неудачного
# выбора всегда содержит «что произошло» + «как поправить», без оценки ребёнка.
#
# Арифметика ограничена возрастом 7-11 лет: целые числа, сложение и вычитание
# в пределах 100, умножение только на 2 и 3. Проверяется тестом
# tests/unit/test_content.py::test_arithmetic_is_age_appropriate.

schema_version: 1

quests:
  # ======================================================= планирование ====
  - id: budget_first_plan
    topic: budgeting
    difficulty: 1
    competency: [fin_1, fin_3]
    title: "Первый план"
    situation: >-
      У тебя 60 монет на период. Питомцу нужно поесть два раза — это 24 монеты.
      Как распределишь остальное?
    choices:
      - id: balanced
        label: "24 на еду, 20 отложить, 16 на желаемое"
        outcome: optimal
        reward: 12
        explanation: >-
          Отличный план: обязательное закрыто, часть денег отложена, и на
          радость тоже осталось. Так получается и накопить, и не заскучать.
      - id: all_fun
        label: "24 на еду, 36 на желаемое"
        outcome: suboptimal
        reward: 4
        explanation: >-
          Питомец сыт и доволен, но на цель ничего не отложено. В следующем
          периоде попробуй оставить хотя бы 10 монет в копилке — цель станет ближе.
      - id: no_food
        label: "60 монет на желаемое"
        outcome: poor
        reward: 2
        pet_effect:
          state: satiety
          delta: -20
        explanation: >-
          Игрушек много, но питомец остался голодным. Обязательные расходы
          планируют первыми. Купи еду в начале следующего периода — всё поправится.

  - id: budget_leftover
    topic: budgeting
    difficulty: 2
    competency: [fin_1, fin_5]
    title: "Остались лишние монеты"
    situation: >-
      Ты всё запланировал, а в конце периода осталось 18 монет. Что с ними сделать?
    choices:
      - id: to_savings
        label: "Отложить в копилку"
        outcome: optimal
        reward: 10
        explanation: >-
          Остаток — это не «лишние» деньги, а возможность. 18 монет в копилке
          приближают цель почти на целый период.
      - id: keep
        label: "Оставить на балансе до следующего периода"
        outcome: suboptimal
        reward: 6
        explanation: >-
          Неплохо: деньги не потрачены зря. Но на балансе их легко потратить
          случайно, а в копилке они точно дождутся цели.
      - id: spend_now
        label: "Купить ночник за 40 — добавить из копилки"
        outcome: poor
        reward: 3
        explanation: >-
          Чтобы купить сейчас, пришлось бы забрать из копилки больше, чем ты
          отложил. Цель отодвинулась. Попробуй сначала накопить, а потом покупать.

  - id: budget_unexpected
    topic: budgeting
    difficulty: 3
    competency: [fin_1, fin_3, fin_5]
    title: "Непредвиденный расход"
    situation: >-
      План готов: 30 на еду, 20 в копилку, 10 на желаемое. Но питомцу нужен
      осмотр у доктора за 30 монет. Как поступишь?
    choices:
      - id: cut_optional
        label: "Отказаться от желаемого и уменьшить копилку на 20"
        outcome: optimal
        reward: 14
        explanation: >-
          Верный порядок: сначала сокращают желаемое, потом накопления.
          Обязательное закрыто, а копилка не обнулилась — в следующем периоде
          догонишь.
      - id: cut_savings_all
        label: "Забрать все 20 из копилки и 10 с желаемого"
        outcome: suboptimal
        reward: 7
        explanation: >-
          Расход закрыт, это главное. Но копилка опустела полностью. В следующий
          раз попробуй сохранить в ней хотя бы часть — цель не будет отдаляться.
      - id: skip_vet
        label: "Пропустить осмотр, оставить план как есть"
        outcome: poor
        reward: 3
        pet_effect:
          state: energy
          delta: -18
        explanation: >-
          Питомец приуныл и стал вялым. Непредвиденные расходы нельзя отложить
          насовсем. Запланируй осмотр первым делом в следующем периоде.

  # ========================================================= сбережения ====
  - id: saving_first_goal
    topic: saving
    difficulty: 1
    competency: [fin_4]
    title: "Выбираем цель"
    situation: >-
      Ты хочешь накопить на самокат за 300 монет. Каждый период можешь
      откладывать 30 монет. За сколько периодов накопишь?
    arithmetic:
      expression: "300 / 30"
      answer: 10
    choices:
      - id: ten
        label: "За 10 периодов"
        outcome: optimal
        reward: 12
        explanation: >-
          Верно: 300 разделить на 30 — это 10. Когда знаешь срок, копить проще:
          видно, сколько осталось.
      - id: three
        label: "За 3 периода"
        outcome: poor
        reward: 3
        explanation: >-
          За 3 периода получится только 90 монет. Проверим: 30 + 30 + 30 = 90.
          До 300 ещё далеко — нужно 10 периодов.
      - id: thirty
        label: "За 30 периодов"
        outcome: suboptimal
        reward: 5
        explanation: >-
          Почти: 30 — это сколько ты откладываешь, а не сколько ждать.
          300 разделить на 30 даёт 10 периодов.

  - id: saving_regular
    topic: saving
    difficulty: 2
    competency: [fin_4, fin_5]
    title: "Понемногу или разом"
    situation: >-
      До цели осталось 60 монет. Можно откладывать по 20 монет три периода
      подряд или ждать и отложить 60 разом через три периода.
    choices:
      - id: regular
        label: "По 20 каждый период"
        outcome: optimal
        reward: 12
        explanation: >-
          Регулярно откладывать проще: 20 монет почти незаметны в плане, а через
          три периода цель достигнута. Небольшие шаги работают лучше рывка.
      - id: lump
        label: "Ждать и отложить 60 разом"
        outcome: suboptimal
        reward: 6
        explanation: >-
          Итог тот же, но накопить 60 за один период трудно — придётся отказаться
          почти от всего желаемого. Маленькими частями легче.
      - id: skip
        label: "Отложить цель на потом"
        outcome: poor
        reward: 2
        explanation: >-
          Цель не приблизилась. Это не ошибка навсегда: отложи 20 монет уже в
          этом периоде, и счётчик снова пойдёт вперёд.

  - id: saving_withdraw
    topic: saving
    difficulty: 3
    competency: [fin_4, fin_5]
    title: "Взять из копилки"
    situation: >-
      В копилке 120 монет из 200 нужных. Очень хочется фотоальбом за 45 монет.
      Что выберешь?
    choices:
      - id: wait
        label: "Не трогать копилку, купить позже"
        outcome: optimal
        reward: 14
        explanation: >-
          Копилка осталась целой — до цели 80 монет. Фотоальбом никуда не
          денется, а цель станет твоей быстрее.
      - id: partial
        label: "Взять 20 монет, добавить с баланса"
        outcome: suboptimal
        reward: 7
        explanation: >-
          Ты сохранил бо́льшую часть копилки. Но до цели стало 100 монет вместо
          80 — примерно на один период дольше.
      - id: take_all
        label: "Взять 45 монет из копилки"
        outcome: poor
        reward: 3
        explanation: >-
          Альбом куплен, но до цели теперь 125 монет вместо 80. Снятие из копилки
          всегда отодвигает цель — приложение показывает на сколько заранее.

  # ================================================== платежи и покупки ====
  - id: payments_compare_price
    topic: payments
    difficulty: 1
    competency: [fin_2, fin_3]
    title: "Что дешевле"
    situation: >-
      Питомец голоден. Каша стоит 12 монет и даёт 25 сытости, суп — 18 монет и
      даёт 38 сытости. У тебя 20 монет.
    choices:
      - id: soup
        label: "Взять суп за 18"
        outcome: optimal
        reward: 10
        explanation: >-
          Суп дороже на 6 монет, но сытости даёт в полтора раза больше. Иногда
          выгоднее купить одну вещь подороже, чем две подешевле.
      - id: porridge
        label: "Взять кашу за 12"
        outcome: suboptimal
        reward: 6
        explanation: >-
          Тоже хорошо: питомец поел и осталось 8 монет. Но сытости меньше — к
          концу периода может понадобиться докупить.
      - id: cookie
        label: "Взять печенье за 9"
        outcome: poor
        reward: 3
        pet_effect:
          state: satiety
          delta: -10
        explanation: >-
          Печенье — это желаемое, а не еда: сытости всего 6. Питомец остался
          голодным. Сначала обязательное, сладкое потом.

  - id: payments_not_enough
    topic: payments
    difficulty: 2
    competency: [fin_2, fin_3]
    title: "Не хватает монет"
    situation: >-
      Ты хочешь ночник за 40 монет, а на балансе 28. Что делать?
    choices:
      - id: cheaper
        label: "Купить наклейки за 7 — тоже радость"
        outcome: optimal
        reward: 10
        explanation: >-
          Отличное решение: настроение поднялось, а 21 монета осталась. Когда
          не хватает, можно найти вариант подешевле.
      - id: wait_next
        label: "Подождать следующий период"
        outcome: optimal
        reward: 10
        explanation: >-
          Тоже верно: перенести необязательную покупку — это не ошибка. В
          следующем периоде монет хватит.
      - id: try_anyway
        label: "Всё равно попробовать купить"
        outcome: poor
        reward: 2
        explanation: >-
          Купить не получится: не хватает 12 монет, а уйти в минус нельзя.
          Зато теперь ты знаешь, сколько нужно докопить.

  - id: payments_need_vs_want
    topic: payments
    difficulty: 3
    competency: [fin_2, fin_5]
    title: "Нужное и желаемое"
    situation: >-
      У тебя 50 монет. Осталось два дня периода. Питомцу нужны вода (6) и плед
      (22). Очень хочется головоломку за 26.
    arithmetic:
      expression: "6 + 22 + 26"
      answer: 54
    choices:
      - id: essentials_then_small
        label: "Вода и плед, потом наклейки за 7"
        outcome: optimal
        reward: 14
        explanation: >-
          Посчитаем: 6 + 22 = 28, осталось 22. Головоломка за 26 не влезает, а
          наклейки — да. Обязательное закрыто, и радость нашлась.
      - id: puzzle_first
        label: "Сначала головоломку за 26"
        outcome: poor
        reward: 3
        pet_effect:
          state: energy
          delta: -15
        explanation: >-
          После головоломки осталось 24 монеты: вода и плед стоят 28 — не хватает
          4. Питомец не выспался. Обязательное покупают первым.
      - id: all_three
        label: "Купить всё: воду, плед и головоломку"
        outcome: suboptimal
        reward: 5
        explanation: >-
          Всё вместе стоит 54 монеты, а у тебя 50 — не хватает 4. Приложение
          не даст уйти в минус. Выбери две покупки из трёх.
