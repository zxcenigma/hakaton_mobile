# Данные команды для презентации.
#
# Заполните этот файл и пересоберите деку:
#
#     python docs/presentation/build_official_deck.py
#
# Всё отсюда попадёт в слайды 1–4. Пустые поля останутся маркером ‹ЗАПОЛНИТЬ›,
# так что видно, что ещё не готово: `--todo` перечислит.
#
# Файл не в .gitignore намеренно — телефоны и ники участников нужны в заявке,
# и команда сама решает, коммитить его или держать локально. Если решите не
# коммитить, добавьте строку `docs/presentation/team.yaml` в .gitignore.

# Название команды. Организаторы уточнили в чате: здесь только имя команды,
# без названия приложения.
name: ""

# Капитан — ФИО и специальность одной строкой.
captain: ""

# Город и регион.
city: ""

# Как образовалась команда, где участники работают или учатся.
# Две-три строки, попадёт на слайд «О проекте».
summary: ""

# Краткая история команды: как собрались, участвовали ли вместе раньше,
# интересные факты. Слайд «Как мы работали», блок 01.
history: ""

# Участники. Шаблон рассчитан ровно на пять карточек; лишние игнорируются,
# недостающие останутся с маркером.
members:
  - name: ""          # Имя Фамилия
    role: ""          # роль в команде
    messenger: ""     # ник в мессенджере
    phone: ""         # номер телефона
    affiliation: ""   # место работы или учёбы

