# Настройки и секреты разделены намеренно.
#
# В compose они лежали в одном `.env`, и это было терпимо: файл не покидал
# ноутбук. В кластере ConfigMap видно всем, у кого есть доступ на чтение
# namespace, а Secret ограничивается отдельно — поэтому пароль не должен
# оказаться в ConfigMap просто потому, что так было удобнее.
apiVersion: v1
kind: ConfigMap
metadata:
  name: monetka-config
  namespace: monetka
data:
  MONETKA_RUN_MODE: "compose"
  MONETKA_LOG_LEVEL: "INFO"
  MONETKA_API_HOST: "0.0.0.0"
  MONETKA_API_PORT: "8000"
  # Внутрикластерный DNS: имя сервиса в том же namespace. Та же привычка, что
  # и в compose, где адресом было имя сервиса.
  MONETKA_S3_ENDPOINT: "http://seaweedfs:9000"
  MONETKA_KAFKA_BOOTSTRAP: "redpanda:9092"
  MONETKA_ICEBERG_CATALOG_URI: "http://iceberg-rest:8181"
  MONETKA_TRINO_HOST: "trino"
  MONETKA_MLFLOW_TRACKING_URI: "http://mlflow:5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: monetka-secrets
  namespace: monetka
type: Opaque
stringData:
  # `stringData` вместо `data`: манифест остаётся читаемым, kubernetes
  # закодирует сам. base64 здесь — не защита, а формат хранения, и это стоит
  # помнить: без шифрования etcd значения лежат в нём открытым текстом.
  # В настоящем проде место этих строк — во внешнем хранилище через CSI.
  MONETKA_S3_ACCESS_KEY: "monetkalocal"
  MONETKA_S3_SECRET_KEY: "monetkalocal"
  POSTGRES_USER: "monetka"
  POSTGRES_PASSWORD: "monetka"
